<!doctype html>
<!-- HTML5文書であることをブラウザーへ伝えます。 -->
<html lang="ja">
<!-- ページの言語が日本語であることを指定します。 -->
<head>
    <!-- 日本語の文字化けを防ぐためUTF-8を指定します。 -->
    <meta charset="utf-8">

    <!-- スマホ幅に合わせてページを表示します。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ブラウザーのタブに表示するページ名です。 -->
    <title>チケット | UNLOCK PICK</title>

    <!-- 全ページ共通のCSSを読み込みます。 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- header.jsが、この場所へ共通ヘッダーを挿入します。 -->
    <div id="common-header"></div>

    <!-- チケットページの主要コンテンツです。 -->
    <main class="content">
        <!-- ページの見出しです。 -->
        <h1>チケット</h1>

        <!-- 今後チケット情報を追加する場所です。 -->
        <p class="description">チケット情報をここへ記載します。</p>
    </main>

    <!-- 共通ヘッダーとスマホメニューのJavaScriptを読み込みます。 -->
    <script src="js/header.js"></script>
</body>
</html>
