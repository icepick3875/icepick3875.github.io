<!doctype html>
<!-- HTML5文書であることをブラウザーへ伝えます。 -->
<html lang="ja">
<!-- ページの言語が日本語であることを指定します。 -->
<head>
    <!-- 日本語の文字化けを防ぐためUTF-8を指定します。 -->
    <meta charset="utf-8">

    <!-- スマホ幅に合わせてページを表示します。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ブラウザーのタブに表示するページ名です。 -->
    <title>イベント2 | ICE PICK</title>

    <!-- 全ページ共通のCSSを読み込みます。 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- header.jsが、この場所へ共通ヘッダーを挿入します。 -->
    <div id="common-header"></div>

    <!-- イベント2詳細ページの主要コンテンツです。 -->
    <main class="content">
        <!-- イベント名を表示します。 -->
        <h1>イベント2</h1>

        <!-- イベント画像を適度な大きさで中央表示します。 -->
        <img
            src="images/coming-soon.png"
            class="event-detail-image"
            alt="イベント2"
        >

        <!-- イベントの説明文です。 -->
        <p class="description">詳細は近日公開予定です。</p>
    </main>

    <!-- 共通ヘッダーとスマホメニューのJavaScriptを読み込みます。 -->
    <script src="js/header.js"></script>
<!-- footer.jsが、この場所へ共通フッターを挿入します。 -->
<div id="common-footer"></div>
    <!-- 共通フッダーを読み込みます。 -->
    <script src="js/footer.js"></script>
</body>
</html>
