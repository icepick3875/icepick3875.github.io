<!doctype html>
<!-- HTML5文書であることをブラウザーへ伝えます。 -->
<html lang="ja">
<!-- ページの言語が日本語であることを指定します。 -->
<head>
    <!-- 日本語の文字化けを防ぐためUTF-8を指定します。 -->
    <meta charset="utf-8">

    <!-- スマホ幅に合わせてページを表示します。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ブラウザーのタブに表示するページ名です。 -->
    <title>イベント一覧 | ICE PICK</title>

    <!-- 全ページ共通のCSSを読み込みます。 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- header.jsが、この場所へ共通ヘッダーを挿入します。 -->
    <div id="common-header"></div>

    <!-- イベント一覧ページの主要コンテンツです。 -->
    <main class="content">
        <!-- ページの見出しです。 -->
        <h1>イベント一覧</h1>

        <!-- イベントカードを自動的に複数列で並べます。 -->
        <section class="event-grid" aria-label="イベント一覧">
            <!-- 公開中のイベント1カードです。 -->
            <article class="card">
                <!-- イベント1詳細ページへ移動します。 -->
                <a href="event1.html">
                    <!-- イベント1画像を表示します。 -->
                    <img src="images/event1.jpg" alt="イベント1">

                    <!-- イベント1のタイトルです。 -->
                    <h2>詳細を見る</h2>
                </a>
            </article>

            <!-- 近日公開予定のイベント2カードです。 -->
            <article class="card">
                <!-- Coming Soon画像を表示します。 -->
                <img src="images/coming-soon.png" alt="イベント2 Coming Soon">

                <!-- イベント2が近日公開であることを表示します。 -->
                <h2>Coming Soon</h2>
            </article>

            <!-- 近日公開予定のイベント3カードです。 -->
            <article class="card">
                <!-- Coming Soon画像を表示します。 -->
                <img src="images/coming-soon.png" alt="Coming Soon">

                <!-- イベント3が近日公開であることを表示します。 -->
                <h2>Coming Soon</h2>
            </article>
        </section>
    </main>

    <!-- 共通ヘッダーとスマホメニューのJavaScriptを読み込みます。 -->
    <script src="js/header.js"></script>
<!-- footer.jsが、この場所へ共通フッターを挿入します。 -->
<div id="common-footer"></div>
    <!-- 共通フッダーを読み込みます。 -->
    <script src="js/footer.js"></script>
</body>
</html>
