<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>コンタクト | ICE PICK</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="common-header"></div>
    <main class="content">
        <h1 class="page-title">コンタクト</h1>
        <section class="social-section">
            <h2 class="social-title">SNS</h2>
            <div class="social-buttons">
                <a class="social-button x-button" href="https://x.com/" target="_blank" rel="noopener noreferrer">X</a>
                <a class="social-button line-button" href="https://line.me/" target="_blank" rel="noopener noreferrer">LINE</a>
            </div>
        </section>
        <section class="contact-section">
            <h2 class="contact-title">お問い合わせ</h2>
            <form class="contact-form">
                <div class="form-group"><label for="contact-name">問い合わせ名 <span class="required-label">必須</span></label><input id="contact-name" name="contact-name" type="text" required></div>
                <div class="form-group"><label for="contact-address">ご連絡先 <span class="required-label">必須</span></label><input id="contact-address" name="contact-address" type="text" required></div>
                <div class="form-group"><label for="contact-message">問い合わせ内容 <span class="required-label">必須</span></label><textarea id="contact-message" name="contact-message" rows="7" required></textarea></div>
                <button class="contact-submit" type="submit">送信する</button>
                <p class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <div id="common-footer"></div>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/contact-form.js"></script>
<!-- スクロール演出です。 -->
 <script src="js/scroll-animation.js"></script>
</body>
</html>
