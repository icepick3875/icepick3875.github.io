<!doctype html>
<!-- HTML5文書であることをブラウザーへ伝えます。 -->
<html lang="ja">
<!-- ページの言語が日本語であることを指定します。 -->
<head>
    <!-- 日本語の文字化けを防ぐためUTF-8を指定します。 -->
    <meta charset="utf-8">

    <!-- スマホ幅に合わせてページを表示します。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ブラウザーのタブに表示するページ名です。 -->
    <title>コンタクト | ICE PICK</title>

    <!-- 全ページ共通のCSSを読み込みます。 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- header.jsが、この場所へ共通ヘッダーを挿入します。 -->
    <div id="common-header"></div>

    <!-- コンタクトページの主要コンテンツです。 -->
   <!-- コンタクトページの主要コンテンツです。 --> <main class="content"> <!-- ページの見出しです。 --> <h1 class="contact-page-title"> コンタクト </h1> 
<!-- SNSリンクを表示する領域です。 -->
<section class="social-section">

    <!-- SNSリンクの見出しです。 -->
    <h2 class="social-title">
        SNS
    </h2>

    <!-- XとLINEのボタンを並べる領域です。 -->
    <div class="social-buttons">

        <!-- Xへのリンクボタンです。 -->
        <a
            href="https://x.com/"
            class="social-button x-button"
            target="_blank"
            rel="noopener noreferrer"
        >
X
        <!-- LINEへのリンクボタンです。 -->
        <a
            href="https://line.me/"
            class="social-button line-button"
            target="_blank"
            rel="noopener noreferrer"
        >
            LINE
        </a>

    </div>

</section>
        <!-- LINEのページを新しいタブで開きます。 -->
    

</section>
<!-- お問い合わせフォーム全体です。 --> <section class="contact-section"> <h2 class="contact-title"> お問い合わせ </h2> <form class="contact-form"> <!-- 問い合わせ名 --> <div class="form-group"> <label for="contact-name"> 問い合わせ名 <span class="required-label">必須</span> </label> <input type="text" id="contact-name" name="contact-name" placeholder="お名前をご入力ください" required > </div> <!-- ご連絡先 --> <div class="form-group"> <label for="contact-address"> ご連絡先 <span class="required-label">必須</span> </label> <input type="text" id="contact-address" name="contact-address" placeholder="メールアドレスまたは電話番号" required > </div> <!-- 問い合わせ内容 --> <div class="form-group"> <label for="contact-message"> 問い合わせ内容 <span class="required-label">必須</span> </label> <textarea id="contact-message" name="contact-message" rows="7" placeholder="お問い合わせ内容をご入力ください" required ></textarea> </div> <!-- 送信ボタン --> <button type="submit" class="contact-submit" > 送信する </button>

<!-- 送信完了メッセージを表示する場所です。 -->
<p
    class="form-message"
    aria-live="polite"
></p>
 </form> </section> </main>
    <!-- 共通ヘッダーとスマホメニューのJavaScriptを読み込みます。 -->
    <script src="js/header.js"></script>

<!-- お問い合わせフォームの動作を  読み込みます。 -->
  <script src="js/contact-form.js"></script>
<!-- footer.jsが、この場所へ共通フッターを挿入します。 -->
<div id="common-footer"></div>
    <!-- 共通フッダーを読み込みます。 -->
    <script src="js/footer.js"></script>
</body>
</html>
