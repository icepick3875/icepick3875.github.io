<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>イラストあふれる部屋からの脱出 | ICE PICK</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="common-header"></div>
    <main class="content">
        <h1 class="event-detail-title">イラストあふれる部屋からの脱出</h1>
        <img class="event-detail-image" src="images/event1.jpg" alt="イベント画像">
        <p class="description">イベント説明文をここへ記載します。</p>
        <section class="event-information">
            <div class="event-information-grid">
                <article class="event-information-card"><h2 class="event-information-label">チーム人数</h2><p class="event-information-value">2～4名</p></article>
                <article class="event-information-card"><h2 class="event-information-label">プレイ時間</h2><p class="event-information-value">約60分</p></article>
                <article class="event-information-card"><h2 class="event-information-label">所要時間</h2><p class="event-information-value">約120分</p></article>
                <article class="event-information-card"><h2 class="event-information-label">イベント形式</h2><p class="event-information-value">ルーム型</p></article>
            </div>
            <a class="ticket-purchase-button" href="https://www.google.com/" target="_blank" rel="noopener noreferrer">チケット購入</a>
        </section>
    </main>
    <div id="common-footer"></div>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
<!-- スクロール演出です。 -->
 <script src="js/scroll-animation.js"></script>
