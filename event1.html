<!doctype html>
<!-- HTML5文書であることをブラウザーへ伝えます。 -->
<html lang="ja">
<!-- ページの言語が日本語であることを指定します。 -->
<head>
    <!-- 日本語の文字化けを防ぐためUTF-8を指定します。 -->
    <meta charset="utf-8">

    <!-- スマホ幅に合わせてページを表示します。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ブラウザーのタブに表示するページ名です。 -->
    <title>イラストあふれる部屋からの脱出 | ICE PICK</title>

    <!-- 全ページ共通のCSSを読み込みます。 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- header.jsが、この場所へ共通ヘッダーを挿入します。 -->
    <div id="common-header"></div>

    <!-- イベント1詳細ページの主要コンテンツです。 -->
    <main class="content">
        <!-- イベント名を表示します。 -->
        <h1>イラストだらけの部屋からの脱出</h1>

        <!-- イベント画像を適度な大きさで中央表示します。 -->
        <img
            src="images/event1.jpg"
            class="event-detail-image"
            alt="イベント1"
        >

        <!-- イベントの説明文です。 -->
        <p class="description">
イベント説明文
</p>
<!-- イベントの基本情報を表示する領域です。 -->
<section class="event-information">

    <!-- イベント情報カードを並べます。 -->
    <div class="event-information-grid">

        <!-- チーム人数のカードです。 -->
        <article class="event-information-card">

            <h2 class="event-information-label">
                チーム人数
            </h2>

            <p class="event-information-value">
                2～4名
            </p>

        </article>

        <!-- プレイ時間のカードです。 -->
        <article class="event-information-card">

            <h2 class="event-information-label">
                プレイ時間
            </h2>

            <p class="event-information-value">
                約60分
            </p>

        </article>

        <!-- 所要時間のカードです。 -->
        <article class="event-information-card">

            <h2 class="event-information-label">
                所要時間
            </h2>

            <p class="event-information-value">
                約120分
            </p>
            </article>
        
                <!--イベント形式のカードです。 -->
        <article class="event-information-card">

            <h2 class="event-information-label">
                イベント形式
            </h2>

            <p class="event-information-value">
                ルーム型
            </p>


        </article>

    </div>

    <!-- 外部のチケット購入ページを新しいタブで開きます。 -->
    <a
        href="https://escape.id/"
        class="ticket-purchase-button"
        target="_blank"
        rel="noopener noreferrer"
    >
        チケット購入
    </a>

</section>
    </main>

    <!-- 共通ヘッダーとスマホメニューのJavaScriptを読み込みます。 -->
    <script src="js/header.js"></script>
<!-- footer.jsが、この場所へ共通フッターを挿入します。 -->
<div id="common-footer"></div>
    <!-- 共通フッダーを読み込みます。 -->
    <script src="js/footer.js"></script>
</body>
</html>
