<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ホーム | ICE PICK</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 初回アクセス時に表示するウェルカム動画です。 -->
    <div id="welcome-screen" class="welcome-screen" aria-label="ICE PICK ウェルカム動画">
        <video id="welcome-video" class="welcome-video" autoplay muted playsinline preload="auto">
            <source src="videos/welcome.mp4" type="video/mp4">
        </video>
        <button id="welcome-skip" class="welcome-skip" type="button">SKIP</button>
    </div>

    <!-- 共通ヘッダーの表示場所です。 -->
    <div id="common-header"></div>

    <!-- ホームページの主要コンテンツです。 -->
    <main class="content">
        <!-- 最新イベントの見出し専用スライド領域です。 -->
        <div class="latest-title-slide latest-intro-pending">
            <h1 class="latest-event-title">最新イベント</h1>
        </div>

        <!-- 最新イベントカード専用スライド領域です。 -->
        <div class="latest-card-slide latest-intro-pending">
            <article class="card latest-event-card">
                <a href="event1.html">
                    <img src="images/event1.jpg" alt="イラストあふれる部屋からの脱出">
                    <h2>詳細を見る</h2>
                </a>
            </article>
        </div>

        <section class="news-section scroll-reveal scroll-reveal-right" id="news">
            <h2 class="latest-news-title">Topics</h2>

            <div class="news-list">
                <article class="news-item">
                    <time datetime="2026-10-14">2026.10.14</time>
                    <p>ホームページを公開しました。</p>
                </article>

                <article class="news-item">
                    <time datetime="2026-10-14">2026.10.14</time>
                    <a href="event1.html" class="news-link">イベント「イラストあふれる部屋からの脱出」の情報を公開しました。</a>
                </article>
            </div>
        </section>

        <section class="contact-section scroll-reveal scroll-reveal-up">
            <h2 class="contact-title">お問い合わせ</h2>

            <form class="contact-form">
                <div class="form-group">
                    <label for="home-contact-name">問い合わせ名 <span class="required-label">必須</span></label>
                    <input id="home-contact-name" name="contact-name" type="text" placeholder="お名前をご入力ください" required>
                </div>

                <div class="form-group">
                    <label for="home-contact-address">ご連絡先 <span class="required-label">必須</span></label>
                    <input id="home-contact-address" name="contact-address" type="text" placeholder="メールアドレスまたは電話番号" required>
                </div>

                <div class="form-group">
                    <label for="home-contact-message">問い合わせ内容 <span class="required-label">必須</span></label>
                    <textarea id="home-contact-message" name="contact-message" rows="7" placeholder="お問い合わせ内容をご入力ください" required></textarea>
                </div>

                <button class="contact-submit" type="submit">送信する</button>
                <p class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <!-- 共通フッターの表示場所です。 -->
    <div id="common-footer"></div>

    <!-- JavaScriptを読み込みます。 -->
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/contact-form.js"></script>
    <script src="js/welcome.js"></script>
    <script src="js/scroll-animation.js"></script>
</body>
</html>
